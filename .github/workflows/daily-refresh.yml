name: daily-refresh

# Medallion refresh: Kaggle CSV -> Bronze (raw, append-only) -> Silver -> Gold -> serving JSON.
# pipeline/refresh.py appends only new or changed rows to Bronze, rebuilds the affected Silver
# months from Bronze, then Gold; build_site_data.py produces the dashboard JSON and chatbot tables.
# First run with an empty Bronze is a full-history bootstrap.
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC, after Kaggle's daily update
  workflow_dispatch:
    inputs:
      rebuild_silver:
        description: "Replay: rebuild ALL of Silver and Gold from Bronze (needs the full Bronze, no Kaggle change)"
        type: boolean
        default: false

permissions:
  id-token: write   # GitHub OIDC -> AWS role (no long-lived keys)
  contents: read

concurrency:
  group: lake-refresh
  cancel-in-progress: false

env:
  LAKE_BUCKET: streampulse-lake-922120357133
  SITE_BUCKET: streampulse-site-922120357133
  AWS_REGION: ap-south-1
  KAGGLE_SLUG: gonzalopezgil/spotify-charts-daily-updated
  KAGGLE_FILE: charts_songs_daily.csv

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the CSV alone is ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt pytest

      - name: Unit tests
        run: python -m pytest -q pipeline/tests

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::922120357133:role/streampulse-github-pipeline
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull existing lake (gold, state, last two months of bronze)
        run: |
          mkdir -p lake
          aws s3 sync "s3://$LAKE_BUCKET/gold" lake/gold --only-show-errors
          aws s3 sync "s3://$LAKE_BUCKET/state" lake/state --only-show-errors || true
          if [ "${{ inputs.rebuild_silver }}" = "true" ]; then
            aws s3 sync "s3://$LAKE_BUCKET/bronze" lake/bronze --only-show-errors || true   # replay needs all of Bronze
          else
            for offset in 0 1; do
              y=$(date -u -d "$(date -u +%Y-%m-01) -$offset month" +%Y)
              m=$(date -u -d "$(date -u +%Y-%m-01) -$offset month" +%-m)
              aws s3 sync "s3://$LAKE_BUCKET/bronze/charts/year=$y/month=$m" \
                "lake/bronze/charts/year=$y/month=$m" --only-show-errors || true
            done
          fi
          du -sh lake || true

      - name: Download Kaggle CSV
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          sudo mkdir -p /mnt/kaggle && sudo chown "$USER" /mnt/kaggle
          kaggle datasets download -d "$KAGGLE_SLUG" -f "$KAGGLE_FILE" -p /mnt/kaggle --force
          cd /mnt/kaggle && { [ -f "$KAGGLE_FILE" ] || unzip -o "$KAGGLE_FILE.zip"; }
          ls -lh /mnt/kaggle

      - name: Refresh Bronze, Silver and Gold
        working-directory: pipeline
        shell: bash
        run: |
          FLAGS=""; [ "${{ inputs.rebuild_silver }}" = "true" ] && FLAGS="--rebuild-silver"
          python refresh.py --csv "/mnt/kaggle/$KAGGLE_FILE" --lake "$GITHUB_WORKSPACE/lake" --memory-limit 5GB $FLAGS | tee ../run_summary.json

      - name: Push to S3
        run: |
          if grep -q '"status": "up_to_date"' run_summary.json; then echo "nothing new"; exit 0; fi
          # Bronze is append-only: upload new files, never --delete
          aws s3 sync lake/bronze "s3://$LAKE_BUCKET/bronze" --only-show-errors
          aws s3 sync lake/gold "s3://$LAKE_BUCKET/gold" --delete --only-show-errors
          while read -r part; do
            aws s3 sync "lake/silver/song_charts/$part" "s3://$LAKE_BUCKET/silver/song_charts/$part" \
              --delete --only-show-errors
          done < lake/state/affected_partitions.txt
          aws s3 cp lake/state/last_run.json "s3://$LAKE_BUCKET/state/last_run.json"

      - name: Build dashboard data
        run: |
          if grep -q '"status": "up_to_date"' run_summary.json; then echo "nothing new"; exit 0; fi
          aws s3 sync "s3://$LAKE_BUCKET/silver" lake/silver --only-show-errors
          python pipeline/build_site_data.py --lake lake --out site_data --chat-out chat_data --memory-limit 5GB
          echo "SITE_DATA_BUILT=1" >> "$GITHUB_ENV"

      - name: Publish dashboard to S3
        if: env.SITE_DATA_BUILT == '1'
        run: |
          # chatbot tables first, version marker last so the Lambda never sees a half-written set
          aws s3 sync chat_data "s3://$LAKE_BUCKET/chat" --delete --exclude "_version.json" --only-show-errors
          python -c "import json,datetime;json.dump({'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat()},open('chat_data/_version.json','w'))"
          aws s3 cp chat_data/_version.json "s3://$LAKE_BUCKET/chat/_version.json" --only-show-errors
          aws s3 sync site_data "s3://$SITE_BUCKET/data" --delete --only-show-errors \
            --cache-control "public, max-age=300" --content-type application/json

      - name: Publish dashboard files
        run: |
          aws s3 sync dashboard "s3://$SITE_BUCKET" --only-show-errors --cache-control "public, max-age=300" \
            --exclude "data/*" --exclude "*.md"

      - name: Summary
        if: always()
        run: |
          echo '### Lake refresh' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat run_summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
