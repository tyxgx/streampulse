{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="page-section page-hero text-center">
  <div class="container">
    <span class="section-eyebrow">Error 404</span>
    <h1 class="section-title" style="font-size: clamp(2rem, 4vw, 3rem);">Page Not Found</h1>
    <p class="section-subtitle mx-auto mb-4">The page you're looking for doesn't exist or may have been moved.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary">Back to Home</a>
  </div>
</section>
{% endblock %}
