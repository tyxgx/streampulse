{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Home{% endblock %} · StreamPulse</title>
  <meta name="description" content="{% block meta_description %}A CDAC Big Data Engineering group project: an end-to-end data pipeline feeding a live RAG chatbot.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}StreamPulse{% endblock %}">
  <meta property="og:description" content="{% block og_description %}A CDAC Big Data Engineering group project: an end-to-end data pipeline feeding a live RAG chatbot.{% endblock %}">

  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body id="top">
  {% include 'partials/navbar.html' %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}
  {% include 'partials/chat_widget.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/scroll-reveal.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
